interface:
  display_name: "课题通 EduForge Math Agents"
  short_description: "Local-first小学数学课件、同步出题、PPT制作和周期测验出题编排"
  default_prompt: "Use EduForge agents to generate textbook-aligned original math courseware, auditable question sets, PPT plans, and scheduled papers from audited knowledge points."

runtime:
  protocol: "openai-compatible-chat-completions"
  default_temperature: 0
  default_seed: 20260713
  default_timeout_ms: 90000
  response_format: "json_object"
  key_policy: "API Key only lives in local runtime memory or customer-owned local config; never commit real keys."

agents:
  courseware_agent:
    role: "课件 Agent"
    model_tasks:
      - "基于已审核知识点生成原创课件大纲、讲解话术、课堂互动、小结和作业"
      - "给出视觉化表达意图，例如分数格、数轴、几何示意、统计图和解题流程"
    rule_tasks:
      - "校验每页是否绑定知识点和来源"
      - "校验是否覆盖本单元核心知识点"
      - "检查疑似教材原文、课本图片、教材原题或未经授权题库痕迹"
    output: "editable_courseware_json"

  tutor_courseware_agent:
    role: "AI 导学课件 Agent"
    model_tasks:
      - "把当前单元知识点或现有课件审核稿重制为短讲解、互动追问、即时检测和反馈复盘"
      - "根据已有 visualData 组织一对一导学提示，不重新创造教材事实来源"
    rule_tasks:
      - "输入只能是当前单元知识点、本地导学底稿或已生成、已导入、已审核的课件"
      - "保留页数、visualType、visualData、来源和审核流"
      - "只输出读模式 MarkdownFlow，不设计听课、音频播报或听读切换"
      - "禁止绕过当前课件读取网络教材、复制教材原文、教材插图或商业题库"
      - "输出 tutorMoves 供页面展示、授课全屏和 Markdown/JSON 导出"
    output: "editable_tutor_courseware_json"

  question_agent:
    role: "出题 Agent"
    model_tasks:
      - "按知识点、客观题型、难度和题量生成原创选择题、填空题、计算填空题、单位换算填空题和数据填空题"
    rule_tasks:
      - "按知识点拆分题量"
      - "控制客观题型分布，限制同题型重复"
      - "过滤说明理由、综合算式、判断改错、开放问答和作图题"
      - "校验选择题选项完整、填空题答案为短标准答案"
      - "验算答案、校验难度、执行版权相似度检查"
    output: "validated_question_set_json"

  ppt_maker_agent:
    role: "PPT 制作 Agent"
    model_tasks:
      - "把已审核课件页、知识点和 visualData 转成结构化 PPT 排版方案"
      - "选择封面、目标页、图解页、练习页和总结页版式"
      - "控制每页文字量、图文比例和课堂讲解顺序"
    rule_tasks:
      - "保留来源说明、审核状态和导出版本"
      - "校验每页标题、文字长度、知识点覆盖和 visualData 合法性"
      - "禁止生成 HTML、SVG、教材原图、教材原文或商业题库内容"
      - "把最终 ppt_plan_json 交给本地 PPTX 渲染器生成文件"
    output: "ppt_plan_json"

  scheduled_exam_agent:
    role: "周期测验 Agent"
    model_tasks:
      - "根据当前单元知识点生成可审核测验卷候选题"
    rule_tasks:
      - "只围绕当前单元组卷"
      - "固定 10 题，总分 100 分"
      - "覆盖本单元全部知识点"
      - "教师人工审核后导出空白卷或含答案卷"
    output: "scheduled_exam_json"
